<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* Results folders on the left, the selected folder on the right (stacked on phones). */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --ink: #14181d; --ink-2: #56606b; --ink-3: #87909a;
  --line: #e0e4e9; --accent: #2a78d6; --accent-soft: #e6effa; --warn: #7a4f00; --warn-soft: #fdf3dc; --warn-line: #efd28f;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1317; --surface: #161b21; --surface-2: #1c232b; --ink: #e6e9ee; --ink-2: #a3acb6; --ink-3: #6f7882;
    --line: #29313a; --accent: #6fa6ef; --accent-soft: #1b2a3e; --warn: #f0c46a; --warn-soft: #2a2213; --warn-line: #5c4720;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1317; --surface: #161b21; --surface-2: #1c232b; --ink: #e6e9ee; --ink-2: #a3acb6; --ink-3: #6f7882;
  --line: #29313a; --accent: #6fa6ef; --accent-soft: #1b2a3e; --warn: #f0c46a; --warn-soft: #2a2213; --warn-line: #5c4720;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
.app { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 100vh; }
aside { border-right: 1px solid var(--line); background: var(--surface); padding: 20px 16px; display: flex;
        flex-direction: column; gap: 14px; }
.brand { display: grid; gap: 2px; }
.brand b { font-size: 17px; }
.hint { color: var(--ink-2); font-size: 12.5px; }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0; }
.runs { display: grid; gap: 6px; }
.run { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px;
       padding: 8px 10px; cursor: pointer; display: grid; gap: 1px; font: inherit; }
.run:hover { border-color: var(--accent); }
.run[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.run .name { font-weight: 600; overflow-wrap: anywhere; }
.run .meta { font-size: 12px; color: var(--ink-2); }
.run .tag { font-size: 11px; color: var(--accent); }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--accent);
          color: var(--accent); background: transparent; border-radius: 8px; padding: 7px 12px; font: inherit;
          font-weight: 600; cursor: pointer; }
.button:hover { background: var(--accent-soft); }
.small { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 6px; padding: 2px 8px;
         font: inherit; font-size: 12px; cursor: pointer; }
.small:hover { border-color: var(--accent); color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
aside footer { margin-top: auto; font-size: 12px; color: var(--ink-3); }
code { font-family: var(--mono); font-size: 12.5px; }
main { padding: 22px clamp(16px, 3vw, 32px) 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px;
       align-content: start; min-width: 0; }
h1 { margin: 0; font-size: 23px; line-height: 1.2; overflow-wrap: anywhere; }
.desc { margin: 4px 0 0; color: var(--ink-2); max-width: 80ch; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { border: 1px solid var(--line); border-radius: 99px; padding: 1px 10px; font-size: 12.5px; color: var(--ink-2);
        background: var(--surface); font-variant-numeric: tabular-nums; }
.fact b { color: var(--ink); font-weight: 600; }
.rerun { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rerun code { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
              overflow-x: auto; max-width: 100%; white-space: nowrap; }
.notices { border: 1px solid var(--warn-line); background: var(--warn-soft); border-radius: 10px; padding: 0; }
.notices summary { cursor: pointer; padding: 9px 14px; font-weight: 700; color: var(--warn); }
.notices ol { margin: 0; padding: 0 16px 12px 40px; display: grid; gap: 6px; }
.notices li { color: var(--ink); }
.notices li b { color: var(--warn); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
         display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.field { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
.field > span:first-child { color: var(--ink-3); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface);
       flex-wrap: wrap; }
.seg button { border: 0; background: none; color: var(--ink-2); padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.group-name { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
select, input[type="number"], input[type="text"] { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
input[type="number"] { width: 64px; }
input[type="range"] { width: 90px; }
details.style > summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
.missing { font-size: 12.5px; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.grid2.single { grid-template-columns: minmax(0, 1fr); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px 12px; min-width: 0; }
.card[hidden] { display: none; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.card h2 { margin: 0; font-size: 14px; font-weight: 600; }
.card .caption { margin: 2px 0 6px; font-size: 12.5px; color: var(--ink-2); }
.card .tools { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chart { width: 100%; height: 400px; }
.chart.short { height: 360px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
td.num { text-align: right; white-space: nowrap; }
tr.off td { opacity: .45; }
td input[type="text"] { width: 21ch; }
td input[type="color"] { width: 28px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
.params { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.badge { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 5px; margin: 1px 4px 1px 0;
         background: var(--warn-soft); color: var(--warn); }
.badge.info { background: var(--accent-soft); color: var(--accent); }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 28px; color: var(--ink-2); background: var(--surface); }
.note { color: var(--warn); font-size: 13px; margin: 0; }
.toast { position: fixed; bottom: 16px; right: 16px; background: var(--ink); color: var(--bg); padding: 8px 14px;
         border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80vw; }
.toast.show { opacity: .95; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  .runs { grid-auto-flow: column; grid-auto-columns: minmax(170px, 1fr); overflow-x: auto; padding-bottom: 4px; }
  aside .hint:not(#count), aside footer { display: none; }
  .chart { height: 330px; }
}
</style>
{{PLOTLY}}
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>banditkit</b><span class="hint" id="count"></span></div>
    <p class="label">Results folders</p>
    <nav class="runs" id="runs" aria-label="Results folders"></nav>
    <label class="button" for="picker">Open a results folder…</label>
    <input id="picker" type="file" webkitdirectory directory multiple hidden>
    <span class="hint">One folder, or a whole <code>results/</code> folder: every <code>summary.json</code> inside is added.
      Nothing is rerun.</span>
    <footer>Rebuild: <code>python -m banditkit dashboard</code></footer>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script id="bk-data" type="application/json">{{DATA}}</script>
<script>
"use strict";
const RUNS = JSON.parse(document.getElementById("bk-data").textContent);
const JSPDF_URL = "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js";
const SVG2PDF_URL = "https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.3/dist/svg2pdf.umd.min.js";
const FAMILY = { mab: "MAB", linear: "Linear", multi_user: "Multi-user linear" };
// Validated categorical palette (light steps, dark steps): color = algorithm family.
const PAL_LIGHT = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"];
const PAL_DARK = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"];
const PALETTES = {
  banditkit: { name: "banditkit (by family)" },
  okabe: { name: "Okabe-Ito (color-blind safe)", colors: ["#0072B2", "#D55E00", "#009E73", "#CC79A7", "#E69F00", "#56B4E9", "#F0E442"] },
  tol: { name: "Paul Tol bright", colors: ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE", "#AA3377", "#BBBBBB"] },
  tableau: { name: "Tableau 10", colors: ["#4E79A7", "#F28E2B", "#E15759", "#76B7B2", "#59A14F", "#EDC948", "#B07AA1",
                                          "#FF9DA7", "#9C755F", "#BAB0AC"] },
  viridis: { name: "Viridis (ordered)", ramp: ["#440154", "#482878", "#3e4989", "#31688e", "#26828e", "#1f9e89", "#35b779",
                                               "#6dcd59", "#b4de2c"] },
  gray: { name: "Grayscale (print)" },
};
const DASHES = ["solid", "dash", "dot", "dashdot", "longdash", "longdashdot"];
const TOKENS = {
  light: { ink: "#14181d", ink2: "#56606b", ink3: "#87909a", grid: "#e9ecf0", axis: "#9aa3ad", surface: "#ffffff" },
  dark: { ink: "#e6e9ee", ink2: "#a3acb6", ink3: "#6f7882", grid: "#252c34", axis: "#4f5963", surface: "#161b21" },
};
const CUMULATIVE = new Set(["regret", "pseudo_regret", "reward", "pareto_regret", "cpu_time", "wall_time"]);
const SANS = "Helvetica, Arial, sans-serif", SERIF = "Times, 'Times New Roman', serif";

// ------------------------------------------------------------------ state (kept in this browser only)
const store = {
  get(key, fallback) { try { const v = localStorage.getItem("banditkit:" + key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
  set(key, value) { try { localStorage.setItem("banditkit:" + key, JSON.stringify(value)); } catch (e) { /* storage off */ } },
};
const DEFAULT_UI = {
  metric: "regret", view: "cumulative", band: "ci", logX: false, logY: false, outliers: "crop", factor: 4, ref: "",
  palette: "banditkit", lines: "technique", markers: false, width: 2, font: 12, legend: "top", theme: "auto",
  finalKind: "box", tradeLogX: "auto", tradeLabels: false, searchLabel: "",
  export: { w: 6.4, h: 4, dpi: 300, font: 10, family: "sans", background: "white", title: false },
};
const ui = Object.assign({}, DEFAULT_UI, store.get("ui", {}));
ui.export = Object.assign({}, DEFAULT_UI.export, ui.export || {});
const perRun = store.get("runs", {});
let current = null, revision = 0;
const save = () => { store.set("ui", ui); store.set("runs", perRun); };

// ------------------------------------------------------------------ helpers
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fmt(v) {
  if (v === null || v === undefined || !isFinite(v)) return "–";
  const a = Math.abs(v);
  if (a >= 1000) return Math.round(v).toLocaleString("en-US");
  if (a >= 10) return v.toFixed(1);
  if (a >= 0.01 || a === 0) return v.toFixed(3).replace(/\.?0+$/, "");
  return v.toExponential(2);
}
function fmtParam(v) {
  if (typeof v === "number") return Number.isInteger(v) ? String(v) : String(+v.toPrecision(3));
  if (v === null) return "None";
  return typeof v === "string" ? v : JSON.stringify(v);
}
function rgba(hex, alpha) {
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}
function mix(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);
  return "#" + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, "0")).join("");
}
function median(xs) { const s = [...xs].sort((a, b) => a - b); const k = s.length >> 1; return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2; }
function toast(text) { const t = document.getElementById("toast"); t.textContent = text; t.classList.add("show");
                       clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); }
function theme() {
  if (ui.theme === "light" || ui.theme === "dark") return ui.theme;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme() {
  if (ui.theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = ui.theme;
}
const runKey = run => run.folder || `${run.name}@${run.created}`;
function rs(run) {
  const k = runKey(run);
  perRun[k] = Object.assign({ hidden: [], names: {}, colors: {}, titles: {} }, perRun[k] || {});
  return perRun[k];
}
const run = () => RUNS[current];
const nameOf = (r, label) => rs(r).names[label] || label;
const higher = (r, m) => r.higher_is_better ? r.higher_is_better.includes(m) : (m === "reward" || m === "pareto_share");
function group(r, m) {
  if (r.metric_groups && r.metric_groups[m]) return r.metric_groups[m];
  if (["cpu_time", "wall_time", "memory_mb"].includes(m)) return "cost";
  if (["pareto_regret", "pareto_share", "unfairness"].includes(m)) return "multi-objective";
  return "performance";
}
const ranked = (r, m) => group(r, m) !== "policy state";
const cumulative = m => CUMULATIVE.has(m) || m.startsWith("env_");
const title = (r, m) => (r.metric_titles || {})[m] || m;
const totalRuns = r => (r.problem || {}).n_runs || 1;

// ------------------------------------------------------------------ styles of the policies
function colorOf(r, pol, i, t) {
  const own = rs(r).colors[pol.label];
  if (own) return own;
  const n = r.policies.length;
  if (ui.palette === "banditkit") {
    const k = PAL_LIGHT.indexOf((pol.color || "").toLowerCase());
    return k >= 0 ? (t === "dark" ? PAL_DARK[k] : PAL_LIGHT[k]) : (pol.color || PAL_LIGHT[i % 8]);
  }
  if (ui.palette === "gray") {
    const [a, b] = t === "dark" ? ["#f2f2f2", "#6a6a6a"] : ["#111111", "#9a9a9a"];
    return mix(a, b, n > 1 ? (i % 4) / 3 : 0);
  }
  if (ui.palette === "viridis") {
    const ramp = PALETTES.viridis.ramp, x = n > 1 ? i / (n - 1) : 0, f = x * (ramp.length - 1), k = Math.floor(f);
    return k >= ramp.length - 1 ? ramp[ramp.length - 1] : mix(ramp[k], ramp[k + 1], f - k);
  }
  const cs = PALETTES[ui.palette].colors;
  return cs[i % cs.length];
}
function dashOf(r, pol, i) {
  if (ui.palette === "gray") return DASHES[i % DASHES.length];
  if (ui.palette !== "banditkit") {
    const size = ui.palette === "viridis" ? Infinity : PALETTES[ui.palette].colors.length;
    const overflow = Math.floor(i / size);
    return ui.lines === "technique" && overflow === 0 ? (pol.dash || "solid") : DASHES[overflow % DASHES.length];
  }
  return ui.lines === "technique" ? (pol.dash || "solid") : "solid";
}
const markersOn = () => ui.markers || ui.palette === "gray";
function styleMap(r, t) {
  // One (color, dash) pair per policy: a repeated pair gets the next dash; dashed lines get hollow markers.
  const used = new Set(), out = {};
  r.policies.forEach((pol, i) => {
    const color = colorOf(r, pol, i, t);
    let dash = dashOf(r, pol, i), k = Math.max(0, DASHES.indexOf(dash)), tries = 0;
    while (used.has(color + dash) && tries++ < DASHES.length) { k++; dash = DASHES[k % DASHES.length]; }
    used.add(color + dash);
    const symbol = pol.symbol || "circle";
    out[pol.label] = { color, dash, symbol: dash !== "solid" && !symbol.endsWith("-open") ? symbol + "-open" : symbol };
  });
  return out;
}

// ------------------------------------------------------------------ data of the selected view
function band(c) {
  if (ui.band === "none") return [null, null];
  if (ui.band === "sd" && c.sd) return [c.mean.map((m, i) => m === null ? null : m - c.sd[i]), c.mean.map((m, i) => m === null ? null : m + c.sd[i])];
  return [c.low, c.high];
}
function viewTransform(r, m) {
  const steps = r.steps, ref = ui.ref && r.curves[m] && r.curves[m][ui.ref] ? r.curves[m][ui.ref].mean : null;
  const perStep = ui.view === "per_step" && cumulative(m) && !ref;
  return (values, i) => {
    let v = values;
    if (v === null || v === undefined) return null;
    if (perStep) v = steps[i] > 0 ? v / steps[i] : null;
    if (ref && v !== null) v = ref[i] > 0 ? v / ref[i] : null;
    return v;
  };
}
function seriesOf(r, m, label) {
  const c = r.curves[m][label], tr = viewTransform(r, m);
  const [lo, hi] = band(c);
  const mapArr = a => a ? a.map((v, i) => tr(v, i)) : null;
  return { x: r.steps, mean: mapArr(c.mean), low: mapArr(lo), high: mapArr(hi) };
}
function finalOf(r, m, label) {
  const f = (r.final[m] || {})[label];
  if (!f) return null;
  const last = r.steps.length - 1, T = r.steps[last];
  const refF = ui.ref && r.final[m] && r.final[m][ui.ref] ? r.final[m][ui.ref].mean : null;
  const perStep = ui.view === "per_step" && cumulative(m) && !refF;
  const tr = v => (v === null || v === undefined) ? null : perStep ? v / T : refF ? (refF > 0 ? v / refF : null) : v;
  let low = f.low, high = f.high;
  if (ui.band === "sd" && f.sd !== undefined) { low = f.mean - f.sd; high = f.mean + f.sd; }
  return { mean: tr(f.mean), low: tr(low), high: tr(high), values: (f.values || []).map(tr), n: f.n };
}
function yTitle(r, m) {
  const t = title(r, m);
  if (ui.ref && r.curves[m] && r.curves[m][ui.ref]) return `${t} / ${t.charAt(0).toLowerCase() + t.slice(1)} of ${nameOf(r, ui.ref)}`;
  if (ui.view === "per_step" && cumulative(m)) return t.replace(/^Cumulative /, "Average ").replace(/\b(\w)/, c => c.toUpperCase()) + " per step";
  return t;
}
function visible(r) { const h = rs(r).hidden; return r.policies.filter(p => !h.includes(p.label)); }
function outliersOf(r, m, labels) {
  if (ui.outliers === "show" || !ranked(r, m) || higher(r, m) || ui.ref) return new Set();
  const finals = labels.map(l => [l, (finalOf(r, m, l) || {}).mean]).filter(([, v]) => v !== null && isFinite(v));
  if (finals.length < 3) return new Set();
  const med = median(finals.map(([, v]) => Math.abs(v)));
  if (!(med > 0)) return new Set();
  return new Set(finals.filter(([, v]) => Math.abs(v) > ui.factor * med).map(([l]) => l));
}

// ------------------------------------------------------------------ figures
function ctxFor(exporting) {
  const t = exporting ? "light" : theme();
  return { t, tok: TOKENS[t], exporting, font: exporting ? ui.export.font * 96 / 72 : ui.font,
           family: exporting ? (ui.export.family === "serif" ? SERIF : SANS) : "system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif",
           titled: exporting && ui.export.title };
}
function axis(ctx, extra) {
  return Object.assign({ gridcolor: ctx.tok.grid, linecolor: ctx.tok.axis, tickcolor: ctx.tok.axis, showline: true, ticks: "outside",
                         zeroline: false, automargin: true, tickfont: { color: ctx.tok.ink2 },
                         title: { font: { color: ctx.tok.ink } } }, extra || {});
}
function legend(ctx) {
  const pos = { bottom: { orientation: "h", x: 0, xanchor: "left", y: -0.3, yanchor: "top" },
                top: { orientation: "h", x: 0, xanchor: "left", y: 1.02, yanchor: "bottom" },
                right: { orientation: "v", x: 1.02, xanchor: "left", y: 1, yanchor: "top" },
                inside: { orientation: "v", x: 0.01, xanchor: "left", y: 0.99, yanchor: "top",

document.getElementById("picker").addEventListener("change", async e => {
  const files = [...e.target.files].filter(f => f.name === "summary.json");
  let first = null;
  for (const file of files) {
    try {
      const r = JSON.parse(await file.text());
      if (!r.curves || !r.policies || !r.steps) continue;
      r.folder = (file.webkitRelativePath || file.name).replace(/\/?summary\.json$/, "");
      r._loaded = true;
      const known = RUNS.findIndex(x => runKey(x) === runKey(r));

  }

    })].join("\n");
  }
  const labels = searchLabels(r), label = labels.includes(ui.searchLabel) ? ui.searchLabel : labels[0], s = r.search[label];
  const params = Object.keys(s.rows[0].params);
  return [[...params, "mean", "std"].map(q).join(","), ...s.rows.map(x => [...params.map(k => q(fmtParam(x.params[k]))), x.mean, x.std].join(","))].join("\n");
}
async function exportChart(id, format) {
  if (format === "csv") { download(new Blob([csvOf(id)], { type: "text/csv" }), fileName(id, "csv")); return; }
  if (!window.Plotly) { toast("Exports need plotly.js"); return; }
  const chart = CHARTS.find(c => c.id === id), fig = chart.build(run(), ctxFor(true));
  if (!fig) return;
  const ex = ui.export, wpx = Math.round(ex.w * 96), hpx = Math.round(ex.h * 96);
  const holder = document.createElement("div");
  holder.style.cssText = `position:fixed;left:-20000px;top:0;width:${wpx}px;height:${hpx}px`;
  document.body.append(holder);
  try {
    const layout = Object.assign({}, fig.layout, { width: wpx, height: hpx, uirevision: undefined });
    delete layout.noYTitle;
    await Plotly.newPlot(holder, fig.data, layout, { staticPlot: true });
    if (format === "png") {
      const url = await Plotly.toImage(holder, { format: "png", width: wpx, height: hpx, scale: ex.dpi / 96 });
      download(new Blob([pngWithDpi(dataUrlBytes(url), ex.dpi)], { type: "image/png" }), fileName(id, "png"));
    } else if (format === "svg") {
      const url = await Plotly.toImage(holder, { format: "svg", width: wpx, height: hpx });
      download(new Blob([decodeURIComponent(url.slice(url.indexOf(",") + 1))], { type: "image/svg+xml" }), fileName(id, "svg"));
    } else {
      const jsPDF = await pdfLibrary(), wpt = ex.w * 72, hpt = ex.h * 72;
      if (jsPDF) {
        const url = await Plotly.toImage(holder, { format: "svg", width: wpx, height: hpx });
        const svg = new DOMParser().parseFromString(decodeURIComponent(url.slice(url.indexOf(",") + 1)), "image/svg+xml").documentElement;
        const doc = new jsPDF({ orientation: wpt >= hpt ? "landscape" : "portrait", unit: "pt", format: [wpt, hpt] });
        holder.append(svg);  // svg2pdf reads the styles of an element in the page
        await doc.svg(svg, { x: 0, y: 0, width: wpt, height: hpt });
        download(doc.output("blob"), fileName(id, "pdf"));
      } else {
        const url = await Plotly.toImage(holder, { format: "jpeg", width: wpx, height: hpx, scale: ex.dpi / 96 });
        const img = new Image();
        img.src = url;
        await img.decode();  // the true pixel size of the JPEG
        download(rasterPdf(dataUrlBytes(url), img.naturalWidth, img.naturalHeight, wpt, hpt), fileName(id, "pdf"));
        toast(`PDF as an image at ${ex.dpi} DPI: the vector PDF library could not be loaded (offline?)`);
      }
    }
  } catch (err) { toast("Export failed: " + err.message); }
  finally { Plotly.purge(holder); holder.remove(); }
}

if (RUNS.length) select(Math.max(0, RUNS.findIndex(r => r.name === wanted)));
else renderMain();
window.addEventListener("hashchange", () => {
  const i = RUNS.findIndex(r => r.name === decodeURIComponent(location.hash.slice(1)));
  if (i >= 0 && i !== current) select(i);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (current !== null && ui.theme === "auto") drawAll(); });
