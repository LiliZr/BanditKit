<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>banditkit results</title>
<style>
/* Layout: a list of results folders on the left, the selected folder on the right (stacked on phones). */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #14181d; --ink-2: #56606b; --ink-3: #87909a;
  --line: #e0e4e9; --accent: #2a78d6; --accent-soft: #e6effa; --warn: #8a5a00; --warn-soft: #fbf1dc;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1317; --surface: #161b21; --ink: #e6e9ee; --ink-2: #a3acb6; --ink-3: #6f7882;
          --line: #29313a; --accent: #6fa6ef; --accent-soft: #1b2a3e; --warn: #e3b25a; --warn-soft: #2b2312;
          color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }
aside { border-right: 1px solid var(--line); background: var(--surface); padding: 20px 16px; display: flex;
        flex-direction: column; gap: 16px; }
.brand { display: grid; gap: 2px; }
.brand b { font-size: 17px; letter-spacing: .01em; }
.brand span, .hint { color: var(--ink-2); font-size: 13px; }
.section-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0; }
.runs { display: grid; gap: 6px; }
.run { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px;
       padding: 9px 11px; cursor: pointer; display: grid; gap: 2px; font: inherit; }
.run:hover { border-color: var(--accent); }
.run[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.run .name { font-weight: 600; overflow-wrap: anywhere; }
.run .meta { font-size: 12px; color: var(--ink-2); }
.run .tag { font-size: 11px; color: var(--accent); }
.add { display: grid; gap: 6px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--accent);
          color: var(--accent); background: transparent; border-radius: 8px; padding: 8px 12px; font: inherit;
          font-weight: 600; cursor: pointer; }
.button:hover { background: var(--accent-soft); }
.button:focus-visible, .run:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
aside footer { margin-top: auto; font-size: 12px; color: var(--ink-3); }
code { font-family: var(--mono); font-size: 12.5px; }
main { padding: 24px clamp(16px, 3vw, 36px) 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px;
       align-content: start; min-width: 0; }
h1 { margin: 0; font-size: 24px; line-height: 1.2; overflow-wrap: anywhere; }
.desc { margin: 4px 0 0; color: var(--ink-2); max-width: 75ch; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; font-size: 12.5px; color: var(--ink-2);
        background: var(--surface); font-variant-numeric: tabular-nums; }
.fact b { color: var(--ink); font-weight: 600; }
.rerun { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rerun code { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
              overflow-x: auto; max-width: 100%; white-space: nowrap; }
.copy { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; font-size: 12.5px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; color: var(--ink-2); padding: 6px 12px; font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); cursor: pointer; }
.grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.card h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.chart { width: 100%; height: 380px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
td.num { text-align: right; white-space: nowrap; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: middle; }
.params { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.badge { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 5px; margin: 1px 4px 1px 0;
         background: var(--warn-soft); color: var(--warn); }
.badge.info { background: var(--accent-soft); color: var(--accent); }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 28px; color: var(--ink-2); background: var(--surface); }
.note { color: var(--warn); font-size: 13px; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  .grid { grid-template-columns: 1fr; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>banditkit</b><span id="count"></span></div>
    <p class="section-label">Results folders</p>
    <nav class="runs" id="runs" aria-label="Results folders"></nav>
    <div class="add">
      <label class="button" for="picker">Open a results folder…</label>
      <input id="picker" type="file" webkitdirectory directory multiple hidden>
      <span class="hint">Pick one folder, or a whole <code>results/</code> folder: every <code>summary.json</code> inside is
        added to the list. Nothing is rerun.</span>
    </div>
    <footer>Rebuild with <code>python -m banditkit dashboard</code></footer>
  </aside>
  <main id="main"></main>
</div>

<script>
"use strict";
const runs = JSON.parse(document.getElementById("bk-data").textContent);
const state = { current: null, metric: "regret", logX: false };
const FAMILY = { mab: "MAB", linear: "Linear", multi_user: "Multi-user linear" };
const LOWER_IS_BETTER = new Set(["regret", "pseudo_regret", "pareto_regret", "unfairness", "cpu_time", "wall_time", "memory_mb"]);

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fmt(v) {
  if (v === null || v === undefined || !isFinite(v)) return "–";
  const a = Math.abs(v);
  if (a >= 1000) return Math.round(v).toLocaleString("en-US");
  if (a >= 10) return v.toFixed(1);
  if (a >= 0.01 || a === 0) return v.toFixed(3).replace(/\.?0+$/, "");
  return v.toExponential(2);
}
function fmtParam(v) {
  if (typeof v === "number") return Number.isInteger(v) ? String(v) : String(+v.toPrecision(3));
  if (v === null) return "None";
  return typeof v === "string" ? v : JSON.stringify(v);
}
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function hexToRgba(hex, alpha) {
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}
function runKey(run) { return run.folder || `${run.name}@${run.created}`; }

// ------------------------------------------------------------------ sidebar
function renderList() {
  const nav = document.getElementById("runs");
  document.getElementById("count").textContent = `${runs.length} results folder${runs.length === 1 ? "" : "s"}`;
  nav.innerHTML = runs.map((r, i) => {
    const p = r.problem || {};
    const meta = [FAMILY[p.family] || p.family, p.horizon ? `T = ${Number(p.horizon).toLocaleString("en-US")}` : null,
                  p.n_runs ? `${p.n_runs} runs` : null].filter(Boolean).join(" · ");
    return `<button class="run" data-i="${i}" aria-current="${state.current === i}">
      <span class="name">${esc(r.name)}</span><span class="meta">${esc(meta)}</span>
      ${r._loaded ? '<span class="tag">opened from disk</span>' : ""}</button>`;
  }).join("");
}
document.getElementById("runs").addEventListener("click", e => {
  const b = e.target.closest(".run");
  if (b) select(Number(b.dataset.i));
});

document.getElementById("picker").addEventListener("change", async e => {
  const files = [...e.target.files].filter(f => f.name === "summary.json");
  let first = null;
  for (const file of files) {
    try {
      const run = JSON.parse(await file.text());
      if (!run.curves || !run.policies) continue;
      run.folder = (file.webkitRelativePath || file.name).replace(/\/?summary\.json$/, "");
      run._loaded = true;
      const known = runs.findIndex(r => runKey(r) === runKey(run));
      if (known >= 0) runs[known] = run; else runs.push(run);
      if (first === null) first = known >= 0 ? known : runs.length - 1;
    } catch (err) { /* not a summary: skip */ }
  }
  e.target.value = "";
  if (first === null) { alertMain("No summary.json found in that folder. Results folders hold summary.json, written by banditkit run."); return; }
  select(first);
});

function alertMain(text) {
  const n = document.createElement("p");
  n.className = "note";
  n.textContent = text;
  document.getElementById("main").prepend(n);
}

// ------------------------------------------------------------------ main view
function select(i) {
  state.current = i;
  const run = runs[i];
  if (!run.curves[state.metric]) state.metric = Object.keys(run.curves)[0];
  try { history.replaceState(null, "", "#" + encodeURIComponent(run.name)); } catch (err) { /* file:// in some browsers */ }
  renderList();
  renderMain();
}

function renderMain() {
  const main = document.getElementById("main");
  if (state.current === null) {
    main.innerHTML = `<div class="empty"><h1>No results yet</h1>
      <p>Run an experiment, then rebuild this page:</p>
      <p><code>python -m banditkit run configs/linear-synthetic.json --generate-dashboard</code></p>
      <p>Or open a results folder with the button on the left.</p></div>`;
    return;
  }
  const run = runs[state.current];
  const p = run.problem || {};
  const facts = [
    ["Problem", FAMILY[p.family] || p.family], ["Actions K", p.n_actions], ["Dimension d", p.n_features],
    ["Users", p.n_users > 1 ? p.n_users : null], ["Objectives", p.reward_dim > 1 ? p.reward_dim : null],
    ["Horizon T", p.horizon ? Number(p.horizon).toLocaleString("en-US") : null],
    ["Instances", p.n_instances], ["Runs", p.n_runs], ["Seed", p.seed],
  ].filter(([, v]) => v !== null && v !== undefined);
  const metrics = Object.keys(run.curves);
  main.innerHTML = `
    <header>
      <h1>${esc(run.name)}</h1>
      ${run.description ? `<p class="desc">${esc(run.description)}</p>` : ""}
    </header>
    <div class="facts">${facts.map(([k, v]) => `<span class="fact">${esc(k)} <b>${esc(v)}</b></span>`).join("")}</div>
    ${run.command ? `<div class="rerun"><span class="hint">Rerun</span><code id="cmd">${esc(run.command)}</code>
      <button class="copy" id="copy">Copy</button></div>` : ""}
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Metric">${metrics.map(m =>
        `<button data-m="${m}" aria-pressed="${m === state.metric}">${esc(run.metric_titles[m] || m)}</button>`).join("")}</div>
      <label class="toggle"><input type="checkbox" id="logx" ${state.logX ? "checked" : ""}> Log-scale steps</label>
      <span class="hint">Lines: mean over runs. Bands and bars: 95% confidence interval of the mean.</span>
    </div>
    <div class="grid">
      <section class="card"><h2 id="curve-title"></h2><div class="chart" id="curves"></div></section>
      <section class="card"><h2 id="final-title"></h2><div class="chart" id="finals"></div></section>
    </div>
    <section class="card"><h2>Policies</h2><div class="table-wrap" id="table"></div></section>`;
  main.querySelector(".seg").addEventListener("click", e => {
    const b = e.target.closest("button[data-m]");
    if (!b) return;
    state.metric = b.dataset.m;
    main.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    drawCharts(); drawTable();
  });
  document.getElementById("logx").addEventListener("change", e => { state.logX = e.target.checked; drawCharts(); });
  const copy = document.getElementById("copy");
  if (copy) copy.addEventListener("click", () => {
    const text = document.getElementById("cmd").textContent;
    navigator.clipboard.writeText(text).then(() => { copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1500); },
      () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("cmd"));
              const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
  });
  drawCharts();
  drawTable();
}

function plotLayout(extra) {
  const ink = cssVar("--ink"), ink2 = cssVar("--ink-2"), line = cssVar("--line");
  return Object.assign({
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    font: { family: cssVar("--sans"), size: 12, color: ink2 },
    margin: { l: 56, r: 12, t: 8, b: 44 },
    hoverlabel: { font: { color: ink } },
    xaxis: { gridcolor: line, linecolor: line, zeroline: false, tickfont: { color: ink2 } },
    yaxis: { gridcolor: line, linecolor: line, zeroline: false, tickfont: { color: ink2 } },
    legend: { orientation: "h", y: -0.18, font: { color: ink } },
  }, extra);
}

function drawCharts() {
  const run = runs[state.current], m = state.metric, title = run.metric_titles[m] || m;
  document.getElementById("curve-title").textContent = `${title} over the steps`;
  document.getElementById("final-title").textContent = `Final ${title.charAt(0).toLowerCase() + title.slice(1)}`;
  if (!window.Plotly) {
    for (const id of ["curves", "finals"]) document.getElementById(id).innerHTML =
      '<p class="note">Charts need plotly.js, loaded from the internet. Rebuild with <code>--offline</code> to embed it. The table below works without it.</p>';
    return;
  }
  const x = run.steps, traces = [];
  for (const pol of run.policies) {
    const c = run.curves[m][pol.label];
    if (!c) continue;
    traces.push({ x, y: c.high, mode: "lines", line: { width: 0 }, hoverinfo: "skip", showlegend: false, legendgroup: pol.label });
    traces.push({ x, y: c.low, mode: "lines", line: { width: 0 }, fill: "tonexty", fillcolor: hexToRgba(pol.color, 0.16),
                  hoverinfo: "skip", showlegend: false, legendgroup: pol.label });
    traces.push({ x, y: c.mean, mode: "lines", name: pol.label, legendgroup: pol.label,
                  line: { color: pol.color, width: 2, dash: pol.dash },
                  hovertemplate: `${esc(pol.label)}: %{y:.4g}<extra></extra>` });
  }
  Plotly.react("curves", traces, plotLayout({
    hovermode: "x unified",
    xaxis: Object.assign(plotLayout().xaxis, { title: { text: "Step" }, type: state.logX ? "log" : "linear" }),
    yaxis: Object.assign(plotLayout().yaxis, { title: { text: title } }),
  }), { displaylogo: false, responsive: true, modeBarButtonsToRemove: ["select2d", "lasso2d"] });

  const rows = run.policies.map(pol => ({ pol, f: run.final[m][pol.label] })).filter(r => r.f && isFinite(r.f.mean));
  const sign = LOWER_IS_BETTER.has(m) ? 1 : -1;
  rows.sort((a, b) => sign * (a.f.mean - b.f.mean));
  rows.reverse();  // best on top
  Plotly.react("finals", [{
    type: "scatter", mode: "markers", orientation: "h",
    x: rows.map(r => r.f.mean), y: rows.map(r => r.pol.label),
    error_x: { type: "data", symmetric: false, array: rows.map(r => r.f.high - r.f.mean),
               arrayminus: rows.map(r => r.f.mean - r.f.low), color: cssVar("--ink-3"), thickness: 1.5, width: 4 },
    marker: { color: rows.map(r => r.pol.color), size: 10, symbol: rows.map(r => r.pol.symbol),
              line: { color: rows.map(r => r.pol.color), width: 1.5 } },
    hovertemplate: "%{y}: %{x:.4g}<extra></extra>", showlegend: false,
  }], plotLayout({
    margin: { l: 10, r: 16, t: 8, b: 44 },
    xaxis: Object.assign(plotLayout().xaxis, { title: { text: title } }),
    yaxis: Object.assign(plotLayout().yaxis, { automargin: true, tickfont: { color: cssVar("--ink") } }),
  }), { displaylogo: false, responsive: true, modeBarButtonsToRemove: ["select2d", "lasso2d"] });
}

function drawTable() {
  const run = runs[state.current], m = state.metric, title = run.metric_titles[m] || m;
  const sign = LOWER_IS_BETTER.has(m) ? 1 : -1;
  const rows = run.policies.map(pol => ({ pol, f: (run.final[m] || {})[pol.label] }));
  rows.sort((a, b) => sign * ((a.f?.mean ?? Infinity) - (b.f?.mean ?? Infinity)));
  const notes = pol => (pol.notes || []).filter(([kind]) => kind !== "from_problem")
    .map(([kind, text]) => `<span class="badge" title="${esc(text)}">${esc(kind)}: ${esc(text.split(" (")[0])}</span>`).join("");
  const best = pol => pol.best_params && Object.keys(pol.best_params).length
    ? `<span class="badge info">searched: ${esc(Object.entries(pol.best_params).map(([k, v]) => `${k}=${fmtParam(v)}`).join(", "))}</span>` : "";
  document.getElementById("table").innerHTML = `<table>
    <thead><tr><th>Policy</th><th class="num">Final ${esc(title.toLowerCase())}</th><th class="num">95% interval</th>
      <th>Hyperparameters (changed)</th><th>Notes</th></tr></thead>
    <tbody>${rows.map(({ pol, f }) => `<tr>
      <td><span class="swatch" style="background:${esc(pol.color)}"></span>${esc(pol.label)}</td>
      <td class="num">${f ? fmt(f.mean) : "–"}</td>
      <td class="num">${f ? `${fmt(f.low)} to ${fmt(f.high)}` : "–"}</td>
      <td class="params">${esc(Object.entries(pol.params || {})
        .map(([k, v]) => `${k}=${fmtParam(v)}`).join(", ") || "defaults")}</td>
      <td>${best(pol)}${notes(pol)}</td></tr>`).join("")}</tbody></table>`;
}

// ------------------------------------------------------------------ start
const wanted = decodeURIComponent(location.hash.slice(1));
renderList();
if (runs.length) select(Math.max(0, runs.findIndex(r => r.name === wanted)));
else renderMain();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (state.current !== null) drawCharts(); });
</script>
</body>
</html>
